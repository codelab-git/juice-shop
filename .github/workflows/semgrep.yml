# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# This workflow file requires a free account on Semgrep.dev to
# manage rules, file ignores, notifications, and more.
# See https://semgrep.dev/docs
#
# It also forwards SARIF findings to a Shuffle webhook for
# downstream SOAR automation (triage, alerting, ticketing, etc.)

name: Semgrep to Shuffle Integration

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '43 1 * * 0'

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read        # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read          # only required for a private repo by upload-sarif to get Action run status
    name: Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout project source
      - uses: actions/checkout@v4

      # Scan code using project's configuration on https://semgrep.dev/manage
      - name: Run Semgrep
        id: semgrep
        uses: returntocorp/semgrep-action@fcd5ab7459e8d91cb1777481980d1b18b4fc6735
        with:
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          publishDeployment: ${{ secrets.SEMGREP_DEPLOYMENT_ID }}
          generateSarif: "1"
        continue-on-error: true  # don't let findings block downstream steps

      # Upload SARIF file to GitHub's Security tab
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

      # Forward the SARIF findings to your Shuffle Webhook
      - name: Forward Findings to Shuffle
        if: always()
        run: |
          if [ -f semgrep.sarif ]; then
            for attempt in 1 2 3; do
              status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.SHUFFLE_WEBHOOK_URL }}" \
                -H "Content-Type: application/json" \
                --data-binary @semgrep.sarif)
              if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
                echo "Shuffle webhook accepted findings (HTTP $status)"
                exit 0
              fi
              echo "Attempt $attempt failed (HTTP $status), retrying..."
              sleep 5
            done
            echo "::warning::Failed to deliver findings to Shuffle after 3 attempts"
          else
            echo "::warning::semgrep.sarif not found, skipping Shuffle forward"
          fi
